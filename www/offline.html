<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Akli</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F4EF; color: #063330; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  img { width: 84px; height: 84px; margin-bottom: 20px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 26px; margin: 0 0 10px; }
  p { margin: 0 0 26px; max-width: 300px; font-size: 15px; line-height: 1.55; color: #4C6561; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; color: #ffffff; background: #063330;
    border: 0; border-radius: 12px; padding: 14px 32px; min-width: 180px;
  }
  button:active { opacity: .85; }
  .note { margin: 14px 0 0; font-size: 13px; min-height: 18px; color: #4C6561; }
</style>
</head>
<body>
  <img src="logo.png" alt="Akli" />
  <h1>No connection</h1>
  <p>Akli needs the internet to load your meals. Check your Wi-Fi or mobile data, then try again.</p>
  <button id="retry" type="button">Try again</button>
  <div class="note" id="note"></div>

<script>
  var SITE = "https://app.akli-lb.org";
  var note = document.getElementById("note");
  function go() {
    note.textContent = "Connecting…";
    window.location.href = SITE;
  }
  document.getElementById("retry").addEventListener("click", go);
  // Reconnect on its own as soon as the phone gets signal back.
  window.addEventListener("online", go);
</script>
</body>
</html>
